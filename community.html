<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DROPZONE — Community</title>
<meta name="description" content="A community for people who love EDM. Share tracks, talk production, find events.">
<meta name="theme-color" content="#07060d">
<meta property="og:title" content="DROPZONE — Community">
<meta property="og:description" content="A community for people who love EDM.">
<meta property="og:image" content="https://kjuhoho.github.io/dropzone-site/media/brand/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kjuhoho.github.io/dropzone-site/media/brand/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307060d'/%3E%3Cpath d='M6 24 16 6l10 18' fill='none' stroke='%2300f0ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-community">
<header class="top">
  <a class="logo" href="./" id="siteName">DROPZONE</a>
  <nav><a class="sec" href="./" data-i18n="nav.tracks">Tracks</a><a href="community.html" class="on" data-i18n="nav.community">Community</a>
    <select id="lang" data-i18n-aria="a.lang" aria-label="Language"></select><span id="authBar" class="authbar"></span></nav>
</header>

<main class="cm-wrap">
  <aside class="cm-left" aria-label="Categories">
    <nav id="boardNav" class="board-nav"></nav>
  </aside>

  <section class="cm-main">
    <p class="demo-banner" id="demoBanner" hidden data-i18n="c.demo"></p>
    <form class="cm-search" id="searchForm" role="search">
      <input id="q" type="search" maxlength="60" data-i18n-ph="c.searchPh" aria-label="Search" autocomplete="off">
    </form>
    <div id="viewHead" class="view-head"></div>
    <div id="profileBox"></div>
    <div id="composerBox"></div>
    <div id="postList" class="feed" aria-live="polite"></div>
    <button id="more" class="more" hidden></button>
  </section>

  <aside class="cm-right">
    <section class="side-card">
      <h3 data-i18n="c.trending"></h3>
      <div id="tagList" class="tag-list"></div>
    </section>
    <section class="side-card" id="featCard" hidden>
      <h3 data-i18n="c.featured"></h3>
      <a class="feat" href="./">
        <img id="featImg" alt="">
        <span><b id="featName"></b><small data-i18n="c.listen"></small></span>
      </a>
    </section>
    <section class="side-card">
      <h3 data-i18n="c.rulesTitle"></h3>
      <ol class="rules"><li data-i18n="c.rule1"></li><li data-i18n="c.rule2"></li><li data-i18n="c.rule3"></li><li data-i18n="c.rule4"></li></ol>
    </section>
  </aside>
</main>

<footer>© <span id="yr"></span> <span id="footName">DROPZONE</span> · <a href="legal.html#terms" data-i18n="f.terms"></a> · <a href="legal.html#privacy" data-i18n="f.privacy"></a></footer>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="common.js"></script>
<script src="community.js"></script>
</body>
</html>
