<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DROPZONE — Terms & Privacy</title>
<meta name="description" content="Terms of use and privacy policy for DROPZONE.">
<meta name="theme-color" content="#07060d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307060d'/%3E%3Cpath d='M6 24 16 6l10 18' fill='none' stroke='%2300f0ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-legal">
<header class="top">
  <a class="logo" href="./" id="siteName">DROPZONE</a>
  <nav><a class="sec" href="./" data-i18n="nav.tracks">Tracks</a><a href="community.html" data-i18n="nav.community">Community</a>
    <select id="lang" data-i18n-aria="a.lang" aria-label="Language"></select><span id="authBar" class="authbar"></span></nav>
</header>

<main>
  <section class="cm-head legal">
    <h1 class="cm-title" data-i18n="legal.title"></h1>
    <p class="sub" data-i18n="legal.updated"></p>

    <h2 id="terms" data-i18n="legal.terms.h"></h2>
    <ol id="termsList" class="legal-list"></ol>

    <h2 id="privacy" data-i18n="legal.privacy.h"></h2>
    <ol id="privacyList" class="legal-list"></ol>
    <p id="contactLine" class="sub" hidden></p>
  </section>
</main>

<footer>© <span id="yr"></span> <span id="footName">DROPZONE</span> · <a href="legal.html#terms" data-i18n="f.terms"></a> · <a href="legal.html#privacy" data-i18n="f.privacy"></a></footer>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  const { $, esc } = DZ;
  DZ.titleKey = "legal.title";
  const draw = () => {
    for (const [id, p] of [["termsList", "t"], ["privacyList", "p"]]) {
      const items = []; for (let i = 1; DZ.I.strings.en["legal." + p + i]; i++) items.push(DZ.T("legal." + p + i));
      $(id).innerHTML = items.map(t => `<li>${esc(t)}</li>`).join("");
    }
    const c = (window.DZ_CONFIG || {}).contact, el = $("contactLine");
    el.hidden = !c; if (c) el.innerHTML = esc(DZ.T("legal.contact")) + ": <a href=\"mailto:" + esc(c) + "\">" + esc(c) + "</a>";
  };
  await DZ.init();
  DZ.onLang(draw); DZ.applyLang();
})();
</script>
</body>
</html>
